# n8n + local AI stack for this starter kit (based on get-n8n.sh compose).
# Run from this directory: docker compose --profile <cpu|gpu-nvidia|gpu-amd> up
# Or from the repo root via the Makefile.
# compose-version: 2

# The sandbox service API, runner and sandbox images ship as one release and
# are only supported together, so a single N8N_SANDBOX_VERSION (from .env)
# pins all three.

name: shask

volumes:
  sandbox-tls:
  pg-data:
  n8n-data:
  qdrant-data:
  ollama-data:

x-n8n: &service-n8n
  image: docker.io/n8nio/n8n:${N8N_VERSION}
  environment:
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: postgres
    DB_POSTGRESDB_PORT: 5432
    DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
    DB_POSTGRESDB_USER: ${POSTGRES_USER}
    DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    N8N_DIAGNOSTICS_ENABLED: false
    N8N_PERSONALIZATION_ENABLED: false
    N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678}
    WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678}
    OLLAMA_HOST: ${OLLAMA_HOST:-ollama:11434}
  env_file: .env

x-ollama: &service-ollama
  image: ollama/ollama:${OLLAMA_VERSION:-0.40.17}
  container_name: ollama
  restart: unless-stopped
  # Reachable on the compose network as both the service name and "ollama".
  networks:
    default:
      aliases:
        - ollama
  # Keep the API internal by default. Uncomment to reach Ollama from the host:
  # ports:
  #   - 11434:11434
  volumes:
    - ollama-data:/root/.ollama
  healthcheck:
    test: ['CMD', 'ollama', 'list']
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 20s

x-init-ollama: &init-ollama
  image: ollama/ollama:${OLLAMA_VERSION:-0.40.17}
  container_name: ollama-pull-llama
  entrypoint: ['sh', '-c']
  command:
    - |
      echo "Waiting for Ollama…";
      until ollama list >/dev/null 2>&1; do sleep 1; done;
      ollama pull llama3.2
  environment:
    OLLAMA_HOST: ${OLLAMA_HOST:-ollama:11434}
  volumes:
    - ollama-data:/root/.ollama

services:
  sandbox-certs:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION}
    container_name: sandbox-certs
    user: '0:0'
    entrypoint: ['sh', '-c']
    command:
      - >
        bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api
        --control-san-prefix sandbox-runner --world-readable &&
        chown -R sandbox-api:sandbox-api /tls/api && chmod -R a+rX /tls
    environment:
      NUM_RUNNERS: '1'
    volumes:
      - sandbox-tls:/tls

  sandbox-api:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION}
    container_name: sandbox-api
    depends_on:
      sandbox-certs:
        condition: service_completed_successfully
    env_file: .env
    environment:
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/api/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/api/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/api/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/api/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: sandbox-runner-1
    volumes:
      - sandbox-tls:/tls:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    # Never publish 8080/9090 to the host on an internet-facing server.
    # n8n reaches this container by service name, over the default Compose network.

  sandbox-runner-1:
    image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind:${N8N_SANDBOX_VERSION}
    container_name: sandbox-runner-1
    privileged: true
    depends_on:
      sandbox-api:
        condition: service_healthy
    env_file: .env
    environment:
      SANDBOX_RUNNER_API_GRPC_ADDR: sandbox-api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: https://sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ':9091'
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: sandbox-runner-1:9091
      SANDBOX_RUNNER_ID: runner-1
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: ghcr.io/n8n-io/n8n-sandbox-service-sandbox:${N8N_SANDBOX_VERSION}
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/runner/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/runner/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: sandbox-api
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/runner/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/runner/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/runner/ca.crt
    volumes:
      - sandbox-tls:/tls:ro
    # Privileged Docker-in-Docker for the AI sandbox. Local learning only —
    # never expose this container's ports publicly.

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  n8n-import:
    <<: *service-n8n
    container_name: n8n-import
    depends_on:
      postgres:
        condition: service_healthy
      sandbox-api:
        condition: service_healthy
    entrypoint: ['sh', '-c']
    command:
      - >
        if [ -z "$(n8n list:workflow --onlyId)" ]; then
          n8n import:credentials --separate --input=/data/shared/credentials && \
          n8n import:workflow --separate --input=/data/shared/workflows
        else
          echo "Workflows exist, skipping import"
        fi
    volumes:
      - ./shared:/data/shared

  n8n:
    <<: *service-n8n
    container_name: n8n
    restart: unless-stopped
    depends_on:
      sandbox-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      n8n-import:
        condition: service_completed_successfully
    ports:
      - 5678:5678 # the only port that should be internet-facing
    volumes:
      - n8n-data:/home/node/.n8n
      - ./shared:/data/shared
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  runners:
    image: ghcr.io/n8n-io/runners:${N8N_VERSION}
    container_name: runners
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      # Idle runners exit and are relaunched on demand (per the task-runners docs)
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: '15'
    # Runs user code from Code nodes. Never publish this container's ports.

  searxng:
    image: searxng/searxng:${SEARXNG_VERSION:-2026.11.23-a7163d091}
    container_name: searxng
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    # Internal-only: n8n reaches it by service name. Never publish its port.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.20.2}
    container_name: qdrant
    restart: unless-stopped
    # Keep the API internal by default. Uncomment to reach Qdrant from the host:
    # ports:
    #   - 6333:6333
    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY:-qdrant}
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'bash -c "exec 3<>/dev/tcp/127.0.0.1/6333"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama-cpu:
    <<: *service-ollama
    profiles: ['cpu']

  ollama-gpu:
    <<: *service-ollama
    profiles: ['gpu-nvidia']
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ['gpu']

  ollama-gpu-amd:
    <<: *service-ollama
    profiles: ['gpu-amd']
    image: ollama/ollama:${OLLAMA_ROCM_VERSION:-0.40.17-rocm}
    devices:
      - /dev/kfd
      - /dev/dri

  ollama-pull-llama-cpu:
    <<: *init-ollama
    profiles: ['cpu']
    depends_on:
      ollama-cpu:
        condition: service_healthy

  ollama-pull-llama-gpu:
    <<: *init-ollama
    profiles: ['gpu-nvidia']
    depends_on:
      ollama-gpu:
        condition: service_healthy

  ollama-pull-llama-gpu-amd:
    <<: *init-ollama
    profiles: ['gpu-amd']
    image: ollama/ollama:${OLLAMA_ROCM_VERSION:-0.40.17-rocm}
    depends_on:
      ollama-gpu-amd:
        condition: service_healthy
